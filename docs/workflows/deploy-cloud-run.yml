name: NEXUS // Keyless Cloud Run CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate via Google Cloud Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: 'personal-engineering-os-2026'
          workload_identity_provider: 'projects/582208055065/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'nexus-control-sa@personal-engineering-os-2026.iam.gserviceaccount.com'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build & Push Container
        run: |
          IMAGE="asia-south1-docker.pkg.dev/personal-engineering-os-2026/nexus-registry/nexus-control-center:${{ github.sha }}"
          docker build -t "$IMAGE" -t "asia-south1-docker.pkg.dev/personal-engineering-os-2026/nexus-registry/nexus-control-center:latest" .
          docker push "$IMAGE"
          docker push "asia-south1-docker.pkg.dev/personal-engineering-os-2026/nexus-registry/nexus-control-center:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy nexus-control-center \
            --image="asia-south1-docker.pkg.dev/personal-engineering-os-2026/nexus-registry/nexus-control-center:latest" \
            --region="asia-south1" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --port=8000
